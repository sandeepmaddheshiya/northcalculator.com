name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: https://northcalculator.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Unit tests (formulas, tokens contrast, content gate)
        run: pnpm test
      - name: i18n parity
        run: pnpm check:i18n
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Build (static export + CSP + page checks)
        run: pnpm build
      - name: Bundle budgets
        run: pnpm check:bundle
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E + accessibility (axe)
        run: pnpm e2e
      - name: Lighthouse budgets
        run: pnpm lhci
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            playwright-report
            test-results
            .lighthouseci
